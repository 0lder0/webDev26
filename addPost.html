<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <link rel="stylesheet" href="res/images/styles.css"> 
</head>
<body>

    <header>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
            </ul>
            <ul class="icon">
                <li>
                    <a href="login.html">
                        <img src="res/images/istockphoto-1300845620-612x612.jpg" alt="User">
                    </a>
                </li>
            </ul>
        </header>

    <main>
        <article class="login-container">
            
            <form action="index.html" class="add-post-form">
                
                <div class="form-row">
                    <label for="postBody">Post<br>body</label>
                    <textarea id="postBody" placeholder="textarea"></textarea>
                </div>
                
                <div class="form-row">
                    <label for="fileSelect">Select<br>file</label>
                    <input type="file" id="fileSelect">
                </div>

                <div class="submit-row">
                    <button type="submit" class="button">Create post</button>
                </div>
                
            </form>
        </article>
    </main>

</body>
</html>
